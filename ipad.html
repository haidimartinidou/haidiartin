    <section style="padding-top:0">
      <div class="gallery three">
        <figure class="frame reveal"><div class="pic" data-file="images/hero-mountains.jpg"><img src="images/hero-mountains.jpg" alt="iPad drawing of olive hills under a golden sunset, hand-lettered: when the city's hotter than you, take the mountains" loading="lazy" /></div><figcaption>In Greek we say that when someone needs an escape they "take the mountains". Greece is actually richer in mountains than beaches. Ergo, it's a good place to take a break when you are not feeling that hot for the city. <span class="muted">iPad</span></figcaption></figure>
        <figure class="frame reveal"><div class="pic" data-file="images/ipad-eden.jpg"><img src="images/ipad-eden.jpg" alt="iPad drawing of the garden of Eden with a tree, an apple on a plinth and a sign reading Eden, captioned: what if it was Adam's idea?" loading="lazy" /></div><figcaption>You know how Eve was the one to give into temptation, represented as the apple in Eden? But we know patriarchy has gone out of its way to get into our heads. And at the end of the day we weren't there. So, what if it was Adam's idea? <span class="muted">iPad</span></figcaption></figure>
        <figure class="frame reveal"><div class="pic" data-file="images/the-moon-is-new.jpeg"><img src="images/the-moon-is-new.jpeg" alt="iPad drawing of a lake and mountains at night under a full moon, hand-lettered: the moon is always new, look at it with a friend" loading="lazy" /></div><figcaption>If you are feeling down, don't forget the moon is up <span class="muted">iPad</span></figcaption></figure>
        <figure class="frame reveal"><div class="pic" data-file="images/its-never-the-dog.jpeg"><img src="images/its-never-the-dog.jpeg" alt="iPad drawing of a dobermann, hand-lettered: do not blame the dogs, blame the people" loading="lazy" /></div><figcaption>Dogs are defensive when they feel threatened. And they may feel threatened because they have been under threat before. Same as you and I. While a breed may have some sharp instincts, it's mostly the people that lead a dog's behaviour. Evolutionarily, dogs chose us to survive. And they are loyal when they find a home. Don't blame the dogs, blame the people. <span class="muted">iPad</span></figcaption></figure>
        <figure class="frame reveal"><div class="pic" data-file="images/ipad-exposure-talent.jpg"><img src="images/ipad-exposure-talent.jpg" alt="iPad drawing of a garden and a bee, talking about not confusing lack of talent with lack of exposure" loading="lazy" /></div><figcaption>Sensory augmentation is proof that our brain can make sense of anything it is presented with. But it can't make sense of the unknown. Hence, to learn, you have to make your peace with being an amateur. You can't make your 100th if you don't make your 1st. <span class="muted">iPad</span></figcaption></figure>
        <figure class="frame reveal"><div class="pic" data-file="images/ipad-orchids.jpeg"><img src="images/ipad-orchids.jpeg" alt="iPad drawing of a pink orchid in bloom, hand-lettered: you are not too much" loading="lazy" /></div><figcaption>If some people keep orchids happy at home, you are not too much <span class="muted">iPad</span></figcaption></figure>
        <figure class="frame reveal"><div class="pic" data-file="images/be-free.jpeg"><img src="images/be-free.jpeg" alt="iPad drawing of a purple desert mountain under a sun, hand-lettered: keep calm and stop trying to define others" loading="lazy" /></div><figcaption>Freedom hides in our ability to accept we do not know others' journey. Stop trying to fit others in the boxes you drew <span class="muted">iPad</span></figcaption></figure>
